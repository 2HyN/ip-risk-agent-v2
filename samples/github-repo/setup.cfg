# setuptools 선언 매니페스트.
#
# 같은 배포판의 setup.py 는 읽지 않는다 — 임의의 파이썬 코드라 실행하지 않고서는
# 의존성을 확정할 수 없다. setup.cfg 는 선언이라 읽을 수 있고, 그래서 이쪽만
# License 검사 대상이다.
[metadata]
name = iprisk-github-sample
version = 0.1.0

[options]
install_requires =
    # REVIEW_REQUIRED — 정적 링크 여부에 따라 의무가 달라진다 (LGPL-2.1).
    psycopg2==2.9.9

[options.extras_require]
test =
    coverage==7.6.1
