services:
  api:
    name: ip-risk-agent-v2-api
    role: api
    port: 8080
    command: [python, -m, uvicorn, ip_risk_agent.main:create_app, --factory, --host, 0.0.0.0, --port, "8080"]
    image: asia-northeast3-docker.pkg.dev/proj-aj22-211200020328/ip-risk-agent-v2/application@${IMAGE_DIGEST}
    serviceAccount: iprisk-v2-api@proj-aj22-211200020328.iam.gserviceaccount.com
    ingress: all
    allowUnauthenticated: true
    minInstances: 0
    maxInstances: 10
    concurrency: 40
    cpu: "1"
    memory: 1Gi
  worker:
    name: ip-risk-agent-v2-worker
    role: worker
    port: 8080
    command: [python, -m, uvicorn, ip_risk_agent.worker:create_app, --factory, --host, 0.0.0.0, --port, "8080"]
    image: asia-northeast3-docker.pkg.dev/proj-aj22-211200020328/ip-risk-agent-v2/application@${IMAGE_DIGEST}
    serviceAccount: iprisk-v2-worker@proj-aj22-211200020328.iam.gserviceaccount.com
    ingress: internal
    allowUnauthenticated: false
    minInstances: 0
    maxInstances: 20
    concurrency: 10
    cpu: "2"
    memory: 2Gi
requiredEnvironment:
  common:
    - APP_ENV
    - APP_ROLE
    - APP_PUBLIC_BASE_URL
    - GCP_PROJECT_ID
    - GCP_REGION
    - FIRESTORE_DATABASE
    - LOCAL_STAGING_BUCKET
    - GOOGLE_DRIVE_SERVICE_ACCOUNT
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY_SECRET_ID
    - SOURCE_CREDENTIAL_SECRET_PREFIX
  api:
    - SESSION_SECRET
    - FRONTEND_DIST_DIR
    - GOOGLE_LOGIN_CLIENT_ID
    - GOOGLE_LOGIN_CLIENT_SECRET
    - GOOGLE_LOGIN_REDIRECT_URI
    - GOOGLE_DRIVE_WEBHOOK_BASE_URL
    - DRIVE_WATCH_CHANNEL_TOKEN
    - GOOGLE_CLOUD_PROJECT_NUMBER
    - GITHUB_APP_SLUG
    - GITHUB_WEBHOOK_SECRET_ID
    - GITHUB_APP_CALLBACK_URL
    - CLOUD_TASKS_LOCATION
    - CLOUD_TASKS_QUEUE
    - ANALYSIS_WORKER_URL
    - CLOUD_TASKS_SERVICE_ACCOUNT
    - SCHEDULER_SERVICE_ACCOUNT
  worker:
    - VERTEX_AI_LOCATION_OR_ENDPOINT_CONFIG
    - KIPRIS_API_KEY_SECRET_ID
    - PACKAGE_METADATA_BASE_URL
optionalEnvironment:
  common:
    - LOG_LEVEL
  worker:
    - GEMINI_MODEL_ID
    - RAG_REGION
    - RAG_CORPUS_ID
    - RAG_CORPUS_VERSION
    # 특허 고도화 전략 스위치 (docs/PATENT_RAG_ENHANCEMENT_PLAN.md §3·§7.2).
    # 미설정 = baseline (현행). 확정 조합: fielded_v5 × hybrid.
    - PATENT_SEARCH_STRATEGY
    - PATENT_COMPARE_STRATEGY
    # 공용 KIPRIS 키의 초당 상한 — 합산 = 동시 분석 수 × 이 값. 확정 2.0 은
    # 큐 maxConcurrentDispatches 8 (합산 16rps < 실측 허용 ~18rps) 를 전제한다.
    - KIPRIS_MAX_RPS
canonicalEnvironment:
  common:
    APP_ENV: production
    GCP_PROJECT_ID: proj-aj22-211200020328
    GCP_REGION: asia-northeast3
    FIRESTORE_DATABASE: ip-risk-agent-v2
    LOCAL_STAGING_BUCKET: proj-aj22-211200020328-iprisk-v2-staging
    # D1 — 사용자가 이 주소로 폴더를 공유한다. 비밀이 아니다. 이 신원은 프로젝트
    # 역할이 0 이고, 접근은 공유에서만 온다.
    GOOGLE_DRIVE_SERVICE_ACCOUNT: iprisk-v2-drive@proj-aj22-211200020328.iam.gserviceaccount.com
    GITHUB_APP_PRIVATE_KEY_SECRET_ID: iprisk-v2-github-private-key
    SOURCE_CREDENTIAL_SECRET_PREFIX: iprisk-v2-cred
  api:
    APP_ROLE: api
    FRONTEND_DIST_DIR: /app/frontend/dist
    GOOGLE_CLOUD_PROJECT_NUMBER: "555102774494"
    GITHUB_WEBHOOK_SECRET_ID: iprisk-v2-github-webhook-secret
    CLOUD_TASKS_LOCATION: asia-northeast3
    CLOUD_TASKS_QUEUE: ip-risk-agent-v2-analysis-changes
    CLOUD_TASKS_SERVICE_ACCOUNT: iprisk-v2-tasks@proj-aj22-211200020328.iam.gserviceaccount.com
    ANALYSIS_WORKER_URL: https://ip-risk-agent-v2-worker-555102774494.asia-northeast3.run.app
    SCHEDULER_SERVICE_ACCOUNT: iprisk-v2-scheduler@proj-aj22-211200020328.iam.gserviceaccount.com
  worker:
    APP_ROLE: worker
    APP_PUBLIC_BASE_URL: https://ip-risk-agent-v2-worker-555102774494.asia-northeast3.run.app
    KIPRIS_API_KEY_SECRET_ID: iprisk-v2-kipris-access-key
    # 특허 고도화 확정 조합 (docs/PATENT_RAG_ENHANCEMENT_PLAN.md E2-10) —
    # 지우면 baseline 으로 복귀한다.
    PATENT_SEARCH_STRATEGY: fielded_v5
    PATENT_COMPARE_STRATEGY: hybrid
    # 공용 키: 합산 상한 = maxInstances × 값. 실측 서버 허용 ~18rps.
    KIPRIS_MAX_RPS: "2.0"
secretEnvironment:
  api:
    SESSION_SECRET: iprisk-v2-session-secret
    GOOGLE_LOGIN_CLIENT_SECRET: iprisk-v2-google-login-client-secret
    DRIVE_WATCH_CHANNEL_TOKEN: iprisk-v2-drive-channel-token
  worker: {}
