# Cloud Tasks 큐 설정.
#
# 재시도는 큐가 담당한다. 코드의 재시도(Gemini/KIPRIS 등)는 짧고 적게 두었으므로
# 두 겹이 곱해지지 않는다.
#
# 적용:
#   gcloud tasks queues create analysis-queue --location=$REGION
#   gcloud tasks queues update analysis-queue --location=$REGION \
#     --max-attempts=5 --max-concurrent-dispatches=10 \
#     --max-dispatches-per-second=10 --min-backoff=10s --max-backoff=300s
name: analysis-queue

rateLimits:
  # 워커 동시 실행 상한. 외부 provider 한도와 비용을 함께 통제한다.
  maxConcurrentDispatches: 10
  maxDispatchesPerSecond: 10

retryConfig:
  # 배포로 고치는 유형의 장애는 수정에 몇 분~한 시간이 걸린다. 재시도 창이
  # 그보다 짧으면(예전 5회 ≈ 2.5분) 고치는 동안 작업이 전부 폐기되어,
  # 고쳤는데 일감이 죽어 있는 상태가 된다 — 실제로 그렇게 특허 분석
  # 배치를 잃었다. 20회 × 최대 600초 ≈ 2시간을 버틴다.
  maxAttempts: 20
  minBackoff: 10s
  maxBackoff: 600s
  maxDoublings: 4
  # 하루가 지난 작업은 재시도해도 의미가 없다.
  maxRetryDuration: 86400s
