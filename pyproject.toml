[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-risk-agent"
version = "0.0.0"
description = "Secure Human-in-the-Loop IP Risk Management System"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.13.4",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "google-cloud-firestore==2.28.1",
  "authlib==1.7.2",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "google-api-python-client==2.198.0",
  "google-auth[requests]==2.56.3",  # [requests] extra 는 의도적이다. Drive client(connectors/google_drive/client.py)와 RAG client(intelligence/rag/engine.py)가 google.auth.transport.requests.Request 를 직접 import 한다.
  "PyJWT[crypto]==2.10.1",
  "defusedxml==0.7.1",
  "PyYAML==6.0.3",
  "google-genai==2.17.0",
  "uvicorn[standard]==0.52.4",
  "google-cloud-secret-manager==2.30.0",
  "google-cloud-tasks==2.24.0",
  "google-cloud-storage==3.13.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx2==2.10.0",  # Starlette 1.6.0 TestClient 의 transport. 위 dependencies 의 httpx==0.28.1(애플리케이션/provider async client)과는 서로 다른 package 이므로 둘 다 유지한다. 이걸 빼면 TestClient test 가 전부 깨진다.
]

[tool.setuptools.packages.find]
where = ["shared/contracts/python", "backend/src"]
include = ["iprisk_contracts*", "ip_risk_agent*"]

[tool.setuptools.package-data]
# Gemini 프롬프트는 코드가 아니라 .md 파일이다. 명시하지 않으면 wheel 에서
# 빠진다. 소스로 실행하는 로컬·테스트에서는 파일이 그 자리에 있어 멀쩡하고,
# Dockerfile 이 `pip install .` 로 설치하는 배포에서만 특허·라이선스 분석이
# FileNotFoundError 로 죽는다.
"ip_risk_agent.intelligence.gemini.prompts" = ["*.md"]
# RAG 커버리지 색인도 같은 이유로 실어야 한다. `rag-corpus/` 는 이미지에 없으므로
# 게이트가 볼 수 있는 표는 이 파일뿐이다. 빠지면 배포에서만 표가 사라진다.
"ip_risk_agent.intelligence.license" = ["*.json"]

[tool.pytest.ini_options]
testpaths = [
  "shared/contracts/tests",
  "tests/control",
  "tests/connectors",
  "tests/intelligence",
  "tests/integration",
  "tests/e2e",
]
# `scripts` 는 스크립트들이 자기 저장소를 경로에 올리려고 들이는 `_repo_path` 때문이다.
# 스크립트로 직접 부를 때는 `sys.path[0]` 이 그 폴더라 저절로 찾지만, 시험은
# `scripts.purge_workspace` 처럼 패키지로 들여서 그 경로가 없다.
pythonpath = ["shared/contracts/python", "backend/src", ".", "scripts"]
addopts = "--strict-config --strict-markers -ra -p no:cacheprovider"
asyncio_mode = "strict"
markers = [
  "live: tests requiring real external providers or credentials",
]
